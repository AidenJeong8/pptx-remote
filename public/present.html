<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPTX Remote</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#8b93a7; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, system-ui, sans-serif; }
  #setup { max-width: 880px; margin: 0 auto; padding: 48px 24px; display:grid; gap:24px; }
  h1 { margin:0; font-size:28px; letter-spacing:-.02em; }
  .sub { color:var(--muted); margin-top:4px; }
  .row { display:grid; grid-template-columns: 1fr 260px; gap:24px; }
  #drop { border:2px dashed var(--line); border-radius:16px; min-height:260px; display:grid; place-items:center; text-align:center; padding:24px; cursor:pointer; transition:.15s; background:var(--panel); }
  #drop.over { border-color:var(--accent); background:#1b2333; }
  #drop strong { display:block; font-size:18px; margin-bottom:6px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; text-align:center; }
  #qr { background:#fff; padding:10px; border-radius:10px; display:inline-block; margin:8px 0; }
  #qr img, #qr canvas { display:block; width:180px; height:180px; }
  #remoteUrl { font-family: ui-monospace, monospace; font-size:12px; color:var(--muted); word-break:break-all; }
  #status { min-height:24px; color:var(--muted); }
  #status.err { color:#ff6b6b; }
  button.primary { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:14px 22px; font-size:16px; font-weight:600; cursor:pointer; }
  button.primary:disabled { opacity:.4; cursor:default; }
  #thumbs { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; }
  #thumbs img { width:100%; border-radius:6px; border:1px solid var(--line); display:block; }
  .spinner { width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; display:inline-block; vertical-align:middle; margin-right:8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #stage { position:fixed; inset:0; background:#000; display:none; }
  #stage.on { display:block; cursor:none; }
  #stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #counter { position:absolute; right:16px; bottom:12px; color:#fff8; font-size:13px; opacity:0; transition:.3s; }
  #stage:hover #counter { opacity:1; }
  @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="setup">
  <div>
    <h1>PPTX Remote</h1>
    <div class="sub">Drop a PowerPoint deck here, then open the remote on your phone.</div>
  </div>
  <div class="row">
    <label id="drop">
      <input type="file" id="file" accept=".pptx,.ppt,.key" hidden>
      <div><strong>Drop a .pptx file</strong><span class="sub">or click to choose one</span></div>
    </label>
    <div class="card">
      <div style="font-weight:600">Phone remote</div>
      <div id="qr"></div>
      <div id="remoteUrl"></div>
      <div class="sub" style="font-size:12px;margin-top:6px">Phone must be on the same Wi-Fi</div>
    </div>
  </div>
  <div id="status"></div>
  <div><button class="primary" id="go" disabled>▶ Present fullscreen</button>
    <span class="sub" style="margin-left:12px">Arrow keys / space / click to advance · Esc to exit</span></div>
  <div id="thumbs"></div>
</div>

<div id="stage"><img id="slide" alt=""><div id="counter"></div></div>

<script>
const $ = (id) => document.getElementById(id);
let state = { slides: [], index: 0 };
const cache = {};

fetch('/api/info').then(r => r.json()).then(({ remoteUrl }) => {
  $('remoteUrl').textContent = remoteUrl;
  if (window.QRCode) new QRCode($('qr'), { text: remoteUrl, width: 360, height: 360, correctLevel: QRCode.CorrectLevel.M });
  else $('qr').style.display = 'none';
});

function preload(i) {
  const src = state.slides[i];
  if (src && !cache[src]) { cache[src] = new Image(); cache[src].src = src; }
}

function render() {
  const { slides, index, status, error, name } = state;
  const s = $('status');
  s.className = error ? 'err' : '';
  if (error) s.textContent = error;
  else if (status === 'converting') s.innerHTML = `<span class="spinner"></span>Converting ${name} with Keynote…`;
  else if (slides.length) s.textContent = `${name} — ${slides.length} slides`;
  else s.textContent = '';
  $('go').disabled = !slides.length;

  const key = slides.join('|');
  if ($('thumbs').dataset.key !== key) {
    $('thumbs').dataset.key = key;
    $('thumbs').innerHTML = slides.map((src, i) => `<img src="${src}" data-i="${i}" loading="lazy">`).join('');
  }
  if (slides.length) {
    $('slide').src = slides[index];
    $('counter').textContent = `${index + 1} / ${slides.length}`;
    preload(index + 1); preload(index - 1);
  }
}

const es = new EventSource('/events');
es.onmessage = (e) => { state = JSON.parse(e.data); render(); };

function go(body) {
  fetch('/api/goto', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}

async function upload(file) {
  if (!file) return;
  $('status').className = '';
  $('status').innerHTML = `<span class="spinner"></span>Uploading ${file.name}…`;
  const r = await fetch('/api/upload', { method: 'POST', headers: { 'X-Filename': encodeURIComponent(file.name) }, body: file });
  if (!r.ok) { $('status').className = 'err'; $('status').textContent = (await r.json()).error; }
}

const drop = $('drop');
$('file').onchange = (e) => upload(e.target.files[0]);
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => upload(e.dataTransfer.files[0]));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); upload(e.dataTransfer.files[0]); });

function present(i) {
  if (typeof i === 'number') go({ index: i });
  $('stage').classList.add('on');
  document.documentElement.requestFullscreen?.().catch(() => {});
}
function exitPresent() {
  $('stage').classList.remove('on');
  if (document.fullscreenElement) document.exitFullscreen();
}
$('go').onclick = () => present();
$('thumbs').onclick = (e) => { if (e.target.dataset.i) present(Number(e.target.dataset.i)); };
$('stage').onclick = () => go({ delta: 1 });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) $('stage').classList.remove('on'); });

document.addEventListener('keydown', (e) => {
  if (!$('stage').classList.contains('on')) return;
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); go({ delta: 1 }); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go({ delta: -1 }); }
  else if (e.key === 'Home') go({ index: 0 });
  else if (e.key === 'End') go({ index: state.slides.length - 1 });
  else if (e.key === 'Escape') exitPresent();
});
</script>
</body>
</html>
