<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Slide Remote</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#8b93a7; --accent:#4f8cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system, system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 0 10px; }
  #name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70%; }
  #count { color:var(--muted); font-variant-numeric:tabular-nums; }
  #dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ff6b6b; margin-right:6px; }
  #dot.live { background:#3ddc84; }
  #current { width:100%; aspect-ratio:16/9; object-fit:contain; background:#000; border-radius:10px; border:1px solid var(--line); display:block; }
  #nextWrap { display:flex; gap:10px; align-items:center; margin-top:10px; color:var(--muted); font-size:13px; }
  #next { width:96px; aspect-ratio:16/9; object-fit:contain; background:#000; border-radius:6px; border:1px solid var(--line); }
  .ctrls { display:grid; grid-template-columns:1fr 2fr; gap:10px; margin:14px 0; }
  .ctrls button { border:0; border-radius:14px; font-size:20px; font-weight:600; padding:22px 0; color:#fff; background:var(--panel); border:1px solid var(--line); }
  .ctrls button.next { background:var(--accent); border-color:var(--accent); }
  .ctrls button:active { transform:scale(.97); }
  #notes { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; white-space:pre-wrap; font-size:16px; min-height:48px; }
  #notes:empty::before { content:'No speaker notes'; color:var(--muted); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:20px 0 8px; font-weight:600; }
  #grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  #grid button { padding:0; border:2px solid transparent; border-radius:8px; background:#000; position:relative; overflow:hidden; }
  #grid button.cur { border-color:var(--accent); }
  #grid img { width:100%; aspect-ratio:16/9; object-fit:contain; display:block; }
  #grid span { position:absolute; left:4px; bottom:3px; font-size:11px; background:#000a; color:#fff; padding:0 5px; border-radius:4px; }
  .empty { text-align:center; color:var(--muted); padding:80px 20px; }
</style>
</head>
<body>
<header><div id="name"><span id="dot"></span>Waiting for deck…</div><div id="count"></div></header>
<div id="main" hidden>
  <img id="current" alt="">
  <div id="nextWrap"><img id="next" alt=""><span id="nextLabel">Next</span></div>
  <div class="ctrls">
    <button id="prev">‹ Prev</button>
    <button id="nextBtn" class="next">Next ›</button>
  </div>
  <h2>Notes</h2>
  <div id="notes"></div>
  <h2>Jump to slide</h2>
  <div id="grid"></div>
</div>
<div id="empty" class="empty">Drop a .pptx onto the presenter page on your Mac.</div>

<script>
const $ = (id) => document.getElementById(id);
let state = { slides: [], index: 0 };

function go(body) {
  navigator.vibrate?.(10);
  fetch('/api/goto', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}
$('prev').onclick = () => go({ delta: -1 });
$('nextBtn').onclick = () => go({ delta: 1 });
$('grid').onclick = (e) => { const b = e.target.closest('button'); if (b) go({ index: Number(b.dataset.i) }); };

function render() {
  const { slides, index, notes, name, status } = state;
  const has = slides.length > 0;
  $('main').hidden = !has;
  $('empty').hidden = has;
  $('empty').textContent = status === 'converting' ? `Converting ${name}…` : 'Drop a .pptx onto the presenter page on your Mac.';
  $('name').lastChild.textContent = name || 'Waiting for deck…';
  if (!has) { $('count').textContent = ''; return; }

  $('count').textContent = `${index + 1} / ${slides.length}`;
  $('current').src = slides[index];
  const n = slides[index + 1];
  $('nextWrap').style.visibility = n ? 'visible' : 'hidden';
  if (n) { $('next').src = n; $('nextLabel').textContent = `Next: slide ${index + 2}`; }
  $('notes').textContent = notes[index] || '';
  $('prev').disabled = index === 0;
  $('nextBtn').disabled = index === slides.length - 1;

  const key = slides.join('|');
  if ($('grid').dataset.key !== key) {
    $('grid').dataset.key = key;
    $('grid').innerHTML = slides.map((s, i) => `<button data-i="${i}"><img src="${s}" loading="lazy"><span>${i + 1}</span></button>`).join('');
  }
  [...$('grid').children].forEach((b, i) => b.classList.toggle('cur', i === index));
}

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => $('dot').classList.add('live');
  es.onmessage = (e) => { state = JSON.parse(e.data); render(); };
  es.onerror = () => $('dot').classList.remove('live'); // EventSource auto-reconnects
}
connect();
</script>
</body>
</html>
