<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>PPTX Remote</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8'/><path d='M12 9l11 7-11 7z' fill='white'/></svg>">
<script src="vendor/peerjs.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<style>
  :root { --bg:#fff; --text:#111; --muted:#888; --line:#e5e5e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a0a0a; --text:#f2f2f2; --muted:#777; --line:#262626; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, system-ui, sans-serif; }
  body { padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px); overflow-x:hidden; }
  #offline { position:fixed; top:0; left:0; right:0; z-index:5; padding:calc(env(safe-area-inset-top) + 6px) 16px 6px; text-align:center; font-size:13px; color:var(--muted); background:var(--bg); }
  .slide { background:#000; border-radius:6px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  #current { width:100%; }
  .ctrls { display:grid; grid-template-columns:1fr 2fr; gap:8px; margin:12px 0 24px; }
  .ctrls button { border-radius:10px; font:600 18px -apple-system, system-ui, sans-serif; padding:22px 0; color:var(--text); background:none; border:1px solid var(--line); touch-action:manipulation; }
  .ctrls button.next { background:var(--text); color:var(--bg); border-color:var(--text); }
  .ctrls button:active { opacity:.7; }
  .ctrls button:disabled { opacity:.3; }
  #notes { white-space:pre-wrap; font-size:18px; line-height:1.5; margin-bottom:32px; }
  #notes:empty { display:none; }
  #grid { display:flex; flex-direction:column; gap:12px; }
  #grid .t { display:flex; align-items:center; gap:14px; cursor:pointer; touch-action:manipulation; color:var(--muted); }
  #grid .t.cur { color:var(--text); font-weight:600; }
  #grid .th { width:96px; flex:none; background:#000; border-radius:4px; overflow:hidden; display:flex; align-items:center; justify-content:center; outline:2px solid transparent; outline-offset:2px; }
  #grid .t.cur .th { outline-color:var(--text); }
  #grid .tt { min-width:0; font-size:15px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  .center { text-align:center; padding:30vh 12px 0; color:var(--muted); }
  .center strong { display:block; color:var(--text); font-weight:600; margin-bottom:4px; }
  .bar { height:2px; background:var(--line); margin:20px auto 0; max-width:200px; }
  .bar i { display:block; height:100%; width:0; background:var(--text); transition:width .15s; }
  .retry { margin-top:20px; background:none; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 18px; font:inherit; }
</style>
</head>
<body>
<div id="offline" hidden>Reconnecting…</div>

<div id="status" class="center"><strong id="statusTitle">Connecting…</strong><div id="statusText"></div><div class="bar" id="bar" hidden><i id="barFill"></i></div><button class="retry" id="retry" hidden>Try again</button></div>

<div id="main" hidden>
  <div class="slide" id="current"></div>
  <div class="ctrls">
    <button id="prev" aria-label="Previous slide">←</button>
    <button id="nextBtn" class="next" aria-label="Next slide">→</button>
  </div>
  <div id="notes"></div>
  <div id="grid"></div>
</div>

<script type="module">
import { loadDeck } from './js/deck.js';

const $ = (id) => document.getElementById(id);
const room = location.hash.slice(1);

let peer, conn, deck = null, deckId = null, index = 0;
let incoming = null; // { id, name, size, buf, got }
let rendered = -1;
let connectTimer, retryTimer;

function status(title, text, { progress = null, retry = false } = {}) {
  $('main').hidden = true;
  $('status').hidden = false;
  $('statusTitle').textContent = title;
  $('statusText').textContent = text || '';
  $('bar').hidden = progress === null;
  if (progress !== null) $('barFill').style.width = `${Math.round(progress * 100)}%`;
  $('retry').hidden = !retry;
}
function dot(cls) { $('offline').hidden = !(cls === 'err' && deck); }
const send = (m) => conn?.open && conn.send(JSON.stringify(m));

if (!room) status('No presentation linked', 'Scan the QR code on the presenter screen.');
else connect();

function connect() {
  clearTimeout(connectTimer);
  if (!deck) status('Connecting…', '');
  if (!peer || peer.destroyed) {
    peer = new Peer({ debug: 1 });
    peer.on('open', openConn);
    peer.on('disconnected', () => { if (!peer.destroyed) peer.reconnect(); });
    peer.on('error', (e) => {
      console.warn('peer', e.type, e);
      if (e.type === 'peer-unavailable') fail('Presentation not found', 'Make sure the presenter page is still open, then scan the QR code again.');
      else if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(e.type)) scheduleRetry();
    });
  } else if (peer.open) openConn();
  // WebRTC can stall silently on restrictive networks.
  connectTimer = setTimeout(() => { if (!conn?.open) fail('Can\'t reach the presenter', 'Try putting your phone on the same Wi-Fi as the computer.'); }, 20000);
}

function openConn() {
  conn?.close();
  const c = peer.connect('pptxremote-' + room, { reliable: true, serialization: 'raw' });
  conn = c;
  let queue = Promise.resolve();
  c.on('open', () => { clearTimeout(connectTimer); dot('on'); send({ t: 'hello', have: deckId }); });
  // Keep messages in order even when a chunk arrives as a Blob and needs async reading.
  c.on('data', (d) => { queue = queue.then(() => onData(d)).catch((e) => console.error(e)); });
  c.on('close', () => { if (conn === c) { dot('err'); scheduleRetry(); } });
  c.on('error', (e) => { console.warn('conn', e); if (conn === c) scheduleRetry(); });
}

function scheduleRetry() {
  clearTimeout(retryTimer);
  if (!deck) status('Reconnecting…', '');
  retryTimer = setTimeout(connect, 1500);
}
function fail(title, text) {
  clearTimeout(connectTimer);
  dot('err');
  if (deck) return scheduleRetry();
  status(title, text, { retry: true });
}
$('retry').onclick = () => { peer?.destroy(); peer = null; connect(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && room && !conn?.open) connect(); });

async function onData(d) {
  if (typeof d !== 'string') {
    if (!incoming) return;
    const bytes = d instanceof ArrayBuffer ? new Uint8Array(d) : ArrayBuffer.isView(d) ? new Uint8Array(d.buffer, d.byteOffset, d.byteLength) : new Uint8Array(await d.arrayBuffer());
    incoming.buf.set(bytes, incoming.got);
    incoming.got += bytes.byteLength;
    status('Loading slides…', '', { progress: incoming.got / incoming.size });
    if (incoming.got >= incoming.size) await finishDeck();
    return;
  }
  const msg = JSON.parse(d);
  if (msg.t === 'nodeck') status('Connected', 'Open a .pptx on the presenter screen.');
  else if (msg.t === 'deck') {
    incoming = { id: msg.id, name: msg.name, size: msg.size, buf: new Uint8Array(msg.size), got: 0 };
    status('Loading slides…', '', { progress: 0 });
  } else if (msg.t === 'state') {
    index = msg.i;
    if (deck && msg.id === deckId) show();
  }
}

async function finishDeck() {
  const { id, buf } = incoming;
  incoming = null;
  status('Loading slides…', '');
  deck?.destroy();
  deck = await loadDeck(buf.buffer);
  deckId = id;
  rendered = -1;
  buildGrid();
  show();
}

let gridObserver;
function buildGrid() {
  gridObserver?.disconnect();
  gridObserver = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (!en.isIntersecting || en.target.dataset.done) continue;
      en.target.dataset.done = '1';
      deck.render(Number(en.target.dataset.i), en.target.firstElementChild, en.target.clientWidth, en.target.clientHeight);
    }
  }, { rootMargin: '300px' });
  $('grid').replaceChildren(...Array.from({ length: deck.count }, (_, i) => {
    const b = document.createElement('div');
    b.setAttribute('role', 'button'); b.tabIndex = 0;
    b.className = 't';
    const th = document.createElement('div');
    th.className = 'th'; th.dataset.i = i;
    th.style.aspectRatio = `${deck.width} / ${deck.height}`;
    th.appendChild(document.createElement('div'));
    const tt = document.createElement('div');
    tt.className = 'tt'; tt.textContent = deck.titles[i];
    b.append(th, tt);
    b.onclick = () => { buzz(); send({ t: 'go', i }); };
    gridObserver.observe(th);
    return b;
  }));
}

function show() {
  $('status').hidden = true;
  $('main').hidden = false;
  index = Math.max(0, Math.min(deck.count - 1, index));
  const cur = $('current');
  cur.style.aspectRatio = `${deck.width} / ${deck.height}`;
  if (rendered !== index) { deck.render(index, cur, cur.clientWidth, cur.clientWidth * deck.height / deck.width); rendered = index; }
  $('notes').textContent = deck.notes[index] || '';
  $('prev').disabled = index === 0;
  $('nextBtn').disabled = index === deck.count - 1;
  [...$('grid').children].forEach((b, i) => b.classList.toggle('cur', i === index));
  keepAwake();
}

window.addEventListener('resize', () => { if (deck) { rendered = -1; show(); } });

function buzz() { navigator.vibrate?.(10); }
$('prev').onclick = () => { buzz(); send({ t: 'step', d: -1 }); };
$('nextBtn').onclick = () => { buzz(); send({ t: 'step', d: 1 }); };

// Keep the phone screen on while presenting.
let wakeLock = null;
async function keepAwake() {
  if (wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => (wakeLock = null)); } catch {}
}
document.addEventListener('click', keepAwake);
</script>
</body>
</html>
