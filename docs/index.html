<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPTX Remote</title>
<meta name="description" content="Present a .pptx and control it from your phone. Nothing to install, nothing uploaded.">
<meta property="og:title" content="PPTX Remote">
<meta property="og:description" content="Present a .pptx and control it from your phone.">
<meta property="og:image" content="https://aidenjeong8.github.io/pptx-remote/img/presenter.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8'/><path d='M12 9l11 7-11 7z' fill='white'/></svg>">
<script src="vendor/peerjs.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/qrcode.js"></script>
<style>
  :root { --bg:#fff; --text:#111; --muted:#888; --line:#e5e5e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a0a0a; --text:#f2f2f2; --muted:#777; --line:#222; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, system-ui, sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  a, button.link { color:var(--muted); text-decoration:none; background:none; border:0; padding:0; font:inherit; cursor:pointer; }
  a:hover, button.link:hover { color:var(--text); }
  header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:20px 24px; }
  header .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #landing { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:0 24px 12vh; text-align:center; }
  h1 { font-size:clamp(26px, 4vw, 34px); font-weight:600; letter-spacing:-.02em; line-height:1.2; margin:0 0 32px; }
  #drop { display:block; width:100%; max-width:520px; padding:56px 24px; border:1px dashed var(--muted); border-radius:12px; cursor:pointer; color:var(--muted); transition:border-color .15s, color .15s; }
  #drop:hover, #drop.over { border-color:var(--text); color:var(--text); }
  #dropStatus { min-height:22px; margin-top:16px; color:var(--muted); }
  #dropStatus.err { color:#e5484d; }
  .fine { margin-top:8px; font-size:13px; color:var(--muted); }

  #app { flex:1; display:flex; gap:48px; align-items:center; justify-content:center; padding:8px 24px 8vh; }
  .left { flex:1; max-width:880px; min-width:0; }
  #preview { --r:1.7778; aspect-ratio:var(--r); width:min(100%, calc((100vh - 190px) * var(--r))); background:#000; border-radius:6px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  #present { margin-top:20px; background:var(--text); color:var(--bg); border:0; border-radius:8px; padding:12px 22px; font:600 15px -apple-system, system-ui, sans-serif; cursor:pointer; }
  .right { flex:none; width:200px; text-align:center; }
  #qr { width:200px; height:200px; padding:10px; background:#fff; border-radius:6px; }
  #qr svg { width:100%; height:100%; display:block; }
  #linkStatus { margin-top:14px; color:var(--muted); }
  #linkStatus.on { color:var(--text); }
  #copyUrl { margin-top:4px; font-size:13px; }

  #stage { position:fixed; inset:0; z-index:100; background:#000; display:flex; align-items:center; justify-content:center; cursor:none; }
  @media (max-width: 760px) { #app { flex-direction:column; gap:32px; } .left { width:100%; } }
</style>
</head>
<body>
<header>
  <span class="name" id="deckName">PPTX Remote</span>
  <span><button class="link" id="another" hidden>Open file</button><a id="gh" href="https://github.com/AidenJeong8/pptx-remote">GitHub</a></span>
</header>

<main id="landing">
  <h1>Present a .pptx.<br>Control it from your phone.</h1>
  <label id="drop">
    <input type="file" id="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>
    Drop a .pptx here, or click to choose
  </label>
  <div id="dropStatus"></div>
  <div class="fine">Your file stays on your devices. Nothing is uploaded.</div>
</main>

<main id="app" hidden>
  <div class="left">
    <div id="preview"></div>
    <button id="present">Present</button>
  </div>
  <div class="right">
    <div id="qr"></div>
    <div id="linkStatus">Connecting…</div>
    <button class="link" id="copyUrl">Copy link</button>
  </div>
</main>

<div id="stage" hidden><div id="stageSlide"></div></div>

<script type="module">
import { loadDeck } from './js/deck.js';

const $ = (id) => document.getElementById(id);
const CHUNK = 16 * 1024;

let deck = null, deckBuf = null, deckId = null, deckName = '', index = 0;
const conns = new Set();

// ---------- Loading a deck ----------
async function openFile(file) {
  if (!file) return;
  if (!/\.pptx$/i.test(file.name)) return dropMsg('That isn\'t a .pptx file. Keynote and Google Slides can export to PowerPoint.', true);
  dropMsg(`Opening ${escapeHtml(file.name)}…`);
  try {
    const buf = await file.arrayBuffer();
    const d = await loadDeck(buf);
    if (!d.count) throw new Error('No slides found in this file.');
    deck?.destroy();
    deck = d; deckBuf = buf; deckName = file.name; deckId = Math.random().toString(36).slice(2, 10); index = 0;
    dropMsg('');
    showApp();
    for (const c of conns) sendDeck(c);
  } catch (e) {
    console.error(e);
    dropMsg(`Couldn't open this file: ${escapeHtml(e.message || String(e))}`, true);
  }
}
function dropMsg(html, err) { $('dropStatus').innerHTML = html; $('dropStatus').className = err ? 'err' : ''; }
function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

$('file').onchange = (e) => { openFile(e.target.files[0]); e.target.value = ''; };
const drop = $('drop');
['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => { e.preventDefault(); openFile(e.dataTransfer.files[0]); });
$('another').onclick = () => $('file').click();

// ---------- Presenter UI ----------
function showApp() {
  $('landing').hidden = true;
  $('app').hidden = false;
  $('another').hidden = false;
  $('gh').hidden = true;
  $('deckName').textContent = deckName.replace(/\.pptx$/i, '');
  $('preview').style.setProperty('--r', deck.width / deck.height);
  update();
}

function update() {
  if (!deck) return;
  const p = $('preview');
  deck.render(index, p, p.clientWidth, p.clientHeight);
  if (!$('stage').hidden) renderStage();
  broadcast({ t: 'state', i: index, n: deck.count, id: deckId });
}

function go(i) {
  if (!deck) return;
  const next = Math.max(0, Math.min(deck.count - 1, i));
  if (next === index) return;
  index = next;
  update();
}

function renderStage() {
  deck.render(index, $('stageSlide'), window.innerWidth, window.innerHeight);
}

$('present').onclick = async () => {
  $('stage').hidden = false;
  try { await document.documentElement.requestFullscreen(); } catch {}
  renderStage();
};
function exitStage() {
  $('stage').hidden = true;
  if (document.fullscreenElement) document.exitFullscreen();
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) $('stage').hidden = true; });
window.addEventListener('resize', () => { if (deck) { if (!$('stage').hidden) renderStage(); const p = $('preview'); deck.render(index, p, p.clientWidth, p.clientHeight); } });
$('stage').onclick = () => go(index + 1);
document.addEventListener('keydown', (e) => {
  if (!deck || e.target.tagName === 'INPUT') return;
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); go(index + 1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(index - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(deck.count - 1);
  else if (e.key === 'Escape') exitStage();
});

// ---------- Phone link (WebRTC via PeerJS) ----------
// The room id is kept for this tab, so a page refresh keeps the same QR code.
let room = sessionStorage.getItem('pptx-room');
if (!room) { room = newRoom(); sessionStorage.setItem('pptx-room', room); }
function newRoom() {
  const a = 'abcdefghijkmnpqrstuvwxyz23456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(10)), (b) => a[b % a.length]).join('');
}

let peer, retries = 0;
function startPeer() {
  peer = new Peer('pptxremote-' + room, { debug: 1 });
  peer.on('open', () => { retries = 0; setLink(); });
  peer.on('connection', (c) => {
    c.on('open', () => { conns.add(c); setLink(); });
    c.on('data', (d) => onData(c, d));
    c.on('close', () => { conns.delete(c); setLink(); });
    c.on('error', () => { conns.delete(c); setLink(); });
  });
  peer.on('disconnected', () => { setLink('Reconnecting…'); setTimeout(() => !peer.destroyed && peer.reconnect(), 1500); });
  peer.on('error', (e) => {
    console.warn('peer', e.type, e);
    if (e.type === 'unavailable-id') {
      // After a refresh the old id can be held for a moment. Retry, then pick a new one.
      peer.destroy();
      if (++retries > 3) { room = newRoom(); sessionStorage.setItem('pptx-room', room); retries = 0; showQR(); }
      setTimeout(startPeer, 1500);
    } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) {
      setLink('Reconnecting…');
      peer.destroy();
      setTimeout(startPeer, 3000);
    }
  });
}

function setLink(text) {
  const n = conns.size;
  const el = $('linkStatus');
  el.className = n && !text ? 'on' : '';
  el.textContent = text || (n ? 'Connected' : (peer?.open ? 'Scan to connect' : 'Connecting…'));
}

function remoteUrl() { return new URL('remote.html#' + room, location.href).href; }
function showQR() {
  const qr = qrcode(0, 'M');
  qr.addData(remoteUrl());
  qr.make();
  $('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}
$('copyUrl').onclick = () => { navigator.clipboard.writeText(remoteUrl()); $('copyUrl').textContent = 'Copied'; setTimeout(() => ($('copyUrl').textContent = 'Copy link'), 1500); };

function onData(c, d) {
  let msg;
  try { msg = JSON.parse(d); } catch { return; }
  if (msg.t === 'hello') {
    if (!deck) c.send(JSON.stringify({ t: 'nodeck' }));
    else if (msg.have === deckId) c.send(JSON.stringify({ t: 'state', i: index, n: deck.count, id: deckId }));
    else sendDeck(c);
  } else if (msg.t === 'go') go(msg.i);
  else if (msg.t === 'step') go(index + (msg.d > 0 ? 1 : -1));
}

async function sendDeck(c) {
  const id = deckId, buf = deckBuf;
  c.send(JSON.stringify({ t: 'deck', id, name: deckName, size: buf.byteLength }));
  const dc = c.dataChannel;
  if (dc) dc.bufferedAmountLowThreshold = 256 * 1024;
  for (let off = 0; off < buf.byteLength; off += CHUNK) {
    if (!c.open || id !== deckId) return; // closed, or a newer deck replaced this one
    while (dc && dc.bufferedAmount > 2 * 1024 * 1024) {
      await new Promise((r) => { dc.addEventListener('bufferedamountlow', r, { once: true }); setTimeout(r, 500); });
    }
    c.send(buf.slice(off, off + CHUNK));
  }
  c.send(JSON.stringify({ t: 'state', i: index, n: deck.count, id: deckId }));
}

function broadcast(msg) {
  const s = JSON.stringify(msg);
  for (const c of conns) if (c.open) c.send(s);
}

showQR();
startPeer();
</script>
</body>
</html>
